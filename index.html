<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умная колонка "Гоша"</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #status { font-size: 24px; margin-bottom: 20px; color: #4CAF50; font-weight: bold; text-align: center; }
        #log { width: 90%; height: 250px; background: #1e1e1e; padding: 15px; overflow-y: auto; font-size: 15px; border-radius: 8px; line-height: 1.4; box-sizing: border-box; }
        button { padding: 15px 30px; font-size: 18px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <button id="startButton">Включить Гошу</button>
    <div id="status">Ожидание...</div>
    <div id="log"></div>

    <script>
        // --- ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ DENO DEPLOY ---
        const WORKER_URL = "https://weak-alpaca-53.slavegex.deno.net";
        
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        
        let isSpeaking = false; 
        let isFollowUpWindow = false; // Флаг открытого диалога
        let followUpTimeout = null;   // Таймер

        // 1. ИСТОРИЯ ДИАЛОГА (Память)
        // Изначально задаем Гоше правила поведения (системный промпт)
        let conversationHistory = [
            { "role": "user", "parts": [{ "text": "Тебя зовут Гоша. Ты умный голосовой помощник. Отвечай кратко, не более 1-3 предложений. Общайся естественно и вежливо." }] },
            { "role": "model", "parts": [{ "text": "Привет! Я Гоша. Буду отвечать кратко и по делу." }] }
        ];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = true;
        recognition.interimResults = false;

        function addLog(text) {
            logDiv.innerHTML += `<div style="margin-bottom: 8px;">${text}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('startButton').addEventListener('click', () => {
            recognition.start();
            document.getElementById('startButton').style.display = 'none';
            statusDiv.innerText = "Слушаю (Скажите 'Гоша')...";
            addLog("<i>Система запущена. Скажите 'Гоша [вопрос]'</i>");
        });

        // 2. УМНОЕ РАСПОЗНАВАНИЕ ТЕКСТА
        recognition.onresult = async (event) => {
            const last = event.results.length - 1;
            const text = event.results[last][0].transcript.toLowerCase().trim();
            let command = "";

            if (isFollowUpWindow) {
                // Если мы в режиме активного диалога, берем всю фразу без "Гоша"
                command = text;
                clearTimeout(followUpTimeout); // Останавливаем таймер засыпания
                isFollowUpWindow = false;
            } else if (text.includes("гоша")) {
                // Иначе ищем триггер-слово
                command = text.substring(text.indexOf("гоша") + 4).trim();
            }

            if (command.length > 0) {
                addLog(`<span style="color:#BB86FC">Вы:</span> ${command}`);
                statusDiv.innerText = "Думаю...";
                statusDiv.style.color = "#FFC107";
                
                isSpeaking = true;
                recognition.stop(); // Глушим уши
                
                await askGemini(command);
            }
        };

        recognition.onend = () => {
            if (!isSpeaking) {
                recognition.start();
            }
        };

        // Запрос к нейросети
        async function askGemini(question) {
            try {
                // Добавляем вопрос пользователя в историю
                conversationHistory.push({ "role": "user", "parts": [{ "text": question }] });

                // Чтобы не выйти за лимиты токенов, храним только последние 12 сообщений (6 пар) + системный промпт
                if (conversationHistory.length > 14) {
                    conversationHistory.splice(2, 2); 
                }

                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    body: JSON.stringify({ contents: conversationHistory }) // Отправляем ВСЮ историю
                });

                const data = await response.json();
                
                if (data.error) throw new Error(`${data.error.message}`);
                if (!data.candidates) throw new Error("Пустой ответ");

                const aiText = data.candidates[0].content.parts[0].text;
                
                // Сохраняем ответ Гоши в историю
                conversationHistory.push({ "role": "model", "parts": [{ "text": aiText }] });
                
                addLog(`<b>Гоша:</b> ${aiText}`);
                speakText(aiText);

            } catch (err) {
                console.error(err);
                addLog(`<b style="color:red">Ошибка:</b> ${err.message}`);
                speakText("Произошла ошибка.");
            }
        }

        // 3. ОБЛАЧНАЯ ОЗВУЧКА (Text-to-Speech)
        function speakText(text) {
            statusDiv.innerText = "Генерирую голос...";
            statusDiv.style.color = "#2196F3";
            
            // Используем бесплатный Edge TTS API. 
            // Голос 'ru-RU-DmitryNeural' - отличный мужской голос, звучит как диктор.
            // Если захотите женский, поменяйте на 'ru-RU-SvetlanaNeural'
            const voice = 'ru-RU-DmitryNeural'; 
            
            // Формируем URL для скачивания аудиофайла
            const url = "https://weak-alpaca-53.slavegex.deno.net" + "/tts?text=" + encodeURIComponent(text);

            // Создаем аудио-плеер
            const audio = new Audio(url);
            
            audio.oncanplay = () => {
                statusDiv.innerText = "Говорю...";
                audio.play();
            };

            audio.onended = () => {
                isSpeaking = false;
                
                // Включаем режим продолжения диалога на 10 секунд
                isFollowUpWindow = true;
                statusDiv.innerText = "Жду ответ... (10 сек)";
                statusDiv.style.color = "#FF9800";
                recognition.start();

                followUpTimeout = setTimeout(() => {
                    isFollowUpWindow = false;
                    statusDiv.innerText = "Слушаю (Скажите 'Гоша')...";
                    statusDiv.style.color = "#4CAF50";
                }, 10000); 
            };

            audio.onerror = () => {
                addLog(`<b style="color:red">Ошибка:</b> Не удалось загрузить голос.`);
                // Резервный план: если API упадет, читаем системным голосом робота
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.onend = audio.onended;
                window.speechSynthesis.speak(utterance);
            };
        }
    </script>
</body>
</html>

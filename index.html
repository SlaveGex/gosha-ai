<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умная колонка "Гоша"</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #status { font-size: 24px; margin-bottom: 20px; color: #4CAF50; }
        #log { width: 90%; height: 200px; background: #1e1e1e; padding: 10px; overflow-y: auto; font-size: 14px; border-radius: 8px; }
        button { padding: 15px 30px; font-size: 18px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <button id="startButton">Включить Гошу</button>
    <div id="status">Ожидание...</div>
    <div id="log"></div>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ CLOUDFLARE WORKER
        const WORKER_URL = "https://gemini-proxy.mrsteep231001.workers.dev";
        
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        let isSpeaking = false; // Флаг, чтобы колонка не слушала саму себя

        // Инициализация распознавания речи
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = true; // Слушать постоянно
        recognition.interimResults = false; // Ждать только полные фразы (тишину)

        function addLog(text) {
            logDiv.innerHTML += `<div>${text}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Кнопка нужна, так как браузеры блокируют микрофон и звук без действия пользователя
        document.getElementById('startButton').addEventListener('click', () => {
            recognition.start();
            document.getElementById('startButton').style.display = 'none';
            statusDiv.innerText = "Слушаю...";
            addLog("Система запущена. Скажите 'Гоша [ваш вопрос]'");
        });

        // Обработка распознанного текста
        recognition.onresult = async (event) => {
            const last = event.results.length - 1;
            const text = event.results[last][0].transcript.toLowerCase().trim();
            addLog(`<i>Вы: ${text}</i>`);

            // Ищем триггер-слово
            if (text.includes("гоша")) {
                const command = text.substring(text.indexOf("гоша") + 4).trim();
                
                if (command.length > 0) {
                    statusDiv.innerText = "Думаю...";
                    statusDiv.style.color = "#FFC107";
                    
                    // Ставим на паузу микрофон, чтобы не записать ответ нейросети
                    isSpeaking = true;
                    recognition.stop();
                    
                    await askGemini(command);
                }
            }
        };

        // Если микрофон отвалился (браузер уснул), перезапускаем его
        recognition.onend = () => {
            if (!isSpeaking) {
                recognition.start();
            }
        };

        // Запрос к нейросети
        async function askGemini(question) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Ты голосовой помощник Гоша. Отвечай очень кратко, не более 2-3 предложений. Запрос пользователя: " + question
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                // ДОБАВЛЕНА ПРОВЕРКА НА ОШИБКУ ОТ GOOGLE
                if (data.error) {
                    throw new Error(`Ошибка от Google: ${data.error.message} (Код: ${data.error.code})`);
                }

                if (!data.candidates || data.candidates.length === 0) {
                    throw new Error("Пустой ответ от нейросети");
                }

                const aiText = data.candidates[0].content.parts[0].text;
                addLog(`<b>Гоша:</b> ${aiText}`);
                speakText(aiText);

            } catch (err) {
                console.error(err);
                addLog(`<b style="color:red">Ошибка:</b> ${err.message}`);
                speakText("Произошла ошибка соединения с сервером.");
            }
        }



        // Озвучка ответа
        function speakText(text) {
            statusDiv.innerText = "Говорю...";
            statusDiv.style.color = "#2196F3";
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            // Можно поиграться со скоростью и тоном
            utterance.rate = 1.1; 
            
            utterance.onend = () => {
                // Как только Гоша договорил, включаем уши обратно
                isSpeaking = false;
                statusDiv.innerText = "Слушаю...";
                statusDiv.style.color = "#4CAF50";
                recognition.start();
            };
            
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
